version: '3.8'

services:
  # FastAPI Application (Development with hot reload)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: college_app_dev
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://host.docker.internal:27017
      - DB_NAME=college_management
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - APP_NAME=College Management System
      - VERSION=1.0.0
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - MAX_FILE_SIZE=2048
    volumes:
      - .:/app
      - /app/__pycache__
    command: sh -c "python init_roles.py && uvicorn main:app --host 0.0.0.0 --port 5000 --reload"
